services:
  postgres:
    image: postgres:16-alpine
    container_name: agentshield-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: agentshield
      POSTGRES_PASSWORD: agentshield
      POSTGRES_DB: agentshield
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentshield -d agentshield"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: