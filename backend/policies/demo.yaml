name: demo_policy
version: 1
description: General policy for the demo agent.

rules:
  - name: allow_order_read
    effect: allow
    action: read
    resource: order

  - name: allow_customer_read
    effect: allow
    action: read
    resource: customer
    priority: 10

  - name: escalate_restricted_customer
    effect: escalate
    action: read
    resource: customer
    conditions:
      data_classification: restricted
    priority: 50

  - name: deny_customer_delete
    effect: deny
    action: delete
    resource: customer
    priority: 100

  - name: default_escalate
    effect: escalate
    priority: 1