name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend:
    name: Backend — lint / migrate / test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: agentshield
          POSTGRES_PASSWORD: agentshield
          POSTGRES_DB: agentshield
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agentshield -d agentshield"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    env:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://agentshield:agentshield@localhost:5432/agentshield
      REDIS_URL: redis://localhost:6379/0
      # CI-only placeholder secrets (32+ chars, all different)
      AGENTSHIELD_JWT_SECRET: ci-jwt-secret-replace-with-32chars-min
      AUDIT_HMAC_SECRET: ci-audit-hmac-secret-replace-32chars
      API_KEY_HMAC_SECRET: ci-apikey-hmac-secret-replace-32chars
      DEMO_MODE: "true"
      RUN_INTEGRATION_TESTS: "true"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt ruff

      - name: Lint (ruff)
        run: ruff check app tests

      - name: Run Alembic migrations
        run: alembic upgrade head

      - name: Check for migration drift
        run: alembic check

      - name: Run tests
        run: pytest -x -q

  frontend:
    name: Frontend — typecheck / build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  docker:
    name: Docker — build backend image
    runs-on: ubuntu-latest
    needs: backend

    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: agentshield-backend:ci
