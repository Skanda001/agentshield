name: AgentShield Autonomous Email Worker

on:
  # Checks inbox and processes emails every 10 minutes
  schedule:
    - cron: "*/10 * * * *"

  # Manual trigger from Actions tab
  workflow_dispatch:

jobs:
  run-agent:
    name: Process Emails → AgentShield
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agent-worker/requirements.txt

      - name: Install dependencies
        run: pip install -r agent-worker/requirements.txt

      - name: Run email agent → AgentShield
        env:
          # AgentShield gateway
          AGENTSHIELD_URL:      ${{ secrets.AGENTSHIELD_URL }}
          AGENTSHIELD_API_KEY:  ${{ secrets.AGENTSHIELD_API_KEY }}
          # Gmail
          GMAIL_ADDRESS:        ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD:   ${{ secrets.GMAIL_APP_PASSWORD }}
          # Groq LLM
          GROQ_API_KEY:         ${{ secrets.GROQ_API_KEY }}
          # Optional: real Neon DB for tools
          DATABASE_URL:         ${{ secrets.DATABASE_URL }}
        run: python agent-worker/run_once.py
